name: Build Qiyou

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_harmony:
        description: Build HarmonyOS with the cloud SDK (local build is preferred)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned app
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app qiyou-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-ios-unsigned
          path: qiyou-ios-unsigned.zip
          if-no-files-found: error

  windows:
    name: Windows desktop
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  web:
    name: Web preview
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-web-preview
          path: build/web
          if-no-files-found: error

  harmony:
    name: HarmonyOS unsigned HAP
    if: github.event_name == 'workflow_dispatch' && inputs.build_harmony
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OHOS_FLUTTER_REVISION: 04d2008b35eae67162f0f11d2fd8e2453092c891
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up HarmonyOS command-line SDK
        id: ohos
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: '6.1.1.280'
          cache: true
      - name: Set up Flutter OHOS
        shell: bash
        run: |
          git clone --depth 1 --branch '3.35.7+ohos-1.0.5' https://gitcode.com/openharmony-tpc/flutter_flutter.git "$RUNNER_TEMP/flutter-ohos"
          test "$(git -C "$RUNNER_TEMP/flutter-ohos" rev-parse HEAD)" = "$OHOS_FLUTTER_REVISION"
          # Flutter's version parser does not recognize +ohos tags. Add only a
          # local, SDK-version alias at the verified upstream release revision.
          git -C "$RUNNER_TEMP/flutter-ohos" tag 3.35.7 HEAD
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
      - name: Verify Flutter SDK version
        run: flutter --version
      - name: Generate matching OHOS runner
        run: |
          flutter create --platforms=ohos --project-name qiyou --org app.qiyou --no-pub .
          python3 scripts/prepare_ohos.py '${{ steps.ohos.outputs.api-version }}'
          flutter pub get
      - run: flutter build hap --release --target-platform ohos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-harmony-unsigned
          path: ohos/entry/build/**/outputs/**/*.hap
          if-no-files-found: error
