name: Build Qiyou

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned app
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app qiyou-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-ios-unsigned
          path: qiyou-ios-unsigned.zip
          if-no-files-found: error

  web:
    name: Web preview
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-web-preview
          path: build/web
          if-no-files-found: error

  harmony:
    name: HarmonyOS unsigned HAP
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OHOS_FLUTTER_REVISION: 0cbc2066b9ea5383d01aa55e4c331c200cdef601
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up HarmonyOS command-line SDK
        id: ohos
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          version: '6.1.1.280'
          cache: true
      - name: Set up Flutter OHOS
        shell: bash
        run: |
          git clone --depth 1 --branch oh-3.35.7-dev https://gitcode.com/openharmony-tpc/flutter_flutter.git "$RUNNER_TEMP/flutter-ohos"
          git -C "$RUNNER_TEMP/flutter-ohos" fetch --depth 1 origin "$OHOS_FLUTTER_REVISION"
          git -C "$RUNNER_TEMP/flutter-ohos" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
      - name: Generate matching OHOS runner
        run: |
          flutter create --platforms=ohos --project-name qiyou --org app.qiyou --no-pub .
          python3 scripts/prepare_ohos.py '${{ steps.ohos.outputs.api-version }}'
          flutter pub get
      - run: flutter build hap --release --target-platform ohos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: qiyou-harmony-unsigned
          path: ohos/entry/build/**/outputs/**/*.hap
          if-no-files-found: error
