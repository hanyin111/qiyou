name: qiyou
description: "栖游：轻量的多游戏日常与体力管理。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/games/
  fonts:
    - family: QiyouSans
      fonts:
        - asset: assets/fonts/QiyouSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/QiyouSans-SemiBold.ttf
          weight: 600
